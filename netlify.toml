[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[images]
  remote_images = ["https://topojoy\\.s3\\.us-east-1\\.amazonaws\\.com/.*", "https://.*\\.s3\\.amazonaws\\.com/.*"]

[[plugins]]
  package = "netlify-plugin-inline-functions-env"