<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/index.css" rel="stylesheet" />
    <title>TopoJoy</title>
    <script type="module" src="src/index.tsx"></script>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 2rem;
      }
      .content {
        max-width: 600px;
        text-align: center;
      }
      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 1rem;
      }
      .description {
        font-size: 1.125rem;
        line-height: 1.75;
        color: #4b5563;
        margin-bottom: 2rem;
      }
      .main-action {
        font-size: 1.5rem;
        padding: 1rem 2rem;
        background-color: #4f46e5;
        color: white;
        text-decoration: none;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        transition: background-color 0.2s;
      }
      .main-action:hover {
        background-color: #4338ca;
      }
      .secondary-action {
        color: #6b7280;
        text-decoration: none;
      }
      .secondary-action:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>Welcome to TopoJoy</h1>
      <p class="description">
        Create stylized, topography-inspired maps that tell a story. Zoom to a
        place that has meaning to a friend, select the area you want to
        remember, then customize the color scheme, features, and background
        text. Send a gift that'll mean something.
      </p>
      <a href="geojson.io/index.html" class="main-action">Open Map Editor</a>
      <a href="app.html" class="secondary-action">View App</a>
    </div>
  </body>
</html>
