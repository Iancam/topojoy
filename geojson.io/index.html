        <button
          id="closeModalBtn"
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
        >

            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"

              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>

                background: none;
                border: none;
