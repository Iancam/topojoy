<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link href="dist/css/tailwind_dist.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap"
      rel="stylesheet"
    />

    <title>TopoJoy: Area Selector</title>

    <link rel="icon" type="image/x-icon" href="/img/favicon.png" />
    <meta name="author" content="Mapbox" />
    <meta
      name="description"
      content="A quick, simple tool for creating, viewing, and sharing spatial data."
    />
    <meta property="og:site_name" content="geojson.io" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@mapbox" />
    <meta name="twitter:creator" content="@mapbox" />
    <meta property="og:url" content="https://geojson.io" />
    <meta property="og:title" content="geojson.io | powered by Mapbox" />
    <meta
      property="og:description"
      content="A quick, simple tool for creating, viewing, and sharing spatial data."
    />
    <meta property="og:image" content="/img/twitter-card-image.png" />

    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src
      'self'
      ;
    child-src
      'self'
      blob:
      ;
    connect-src
      'self'
      *
      ;
    font-src
      https://fonts.gstatic.com/
      'self'
      ;
    frame-src
      'self'
      ;
    img-src
      'self'
      data:
      *
      ;
    script-src
      'self'
      'unsafe-eval'
      'unsafe-inline'
      https://d3js.org
      https://cdn.segment.com
      https://assets.customer.io
      https://secure.gaug.es
      https://www.google-analytics.com
      https://www.googletagmanager.com/gtag/js
      https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-rtl-text/v0.2.3/mapbox-gl-rtl-text.js
      https://docs.mapbox.com
      ;
    style-src
      'self'
      'unsafe-inline'
      ;
  "
    />
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- Add segment tracking for tool usage -->
    <script src="https://docs.mapbox.com/analytics.min.js"></script>
    <style>
      /*
   * http://seclab.stanford.edu/websec/framebusting/framebust.pdf
   */
      body {
        display: none;
      }
    </style>
  </head>

  <body id="geojsonio-body" class="h-full">
    <div class="geojsonio flex flex-col h-full">
      <div class="text-white bg-slate-800 font-sans px-3 flex justify-between">
        <div class="font-extrabold flex items-center tracking-wide text-base">
          TopoJoy
        </div>
        <div class="flex-grow flex justify-end">
          <div style="height: 42px"></div>
          <div class="flex items-center bg-pink" style="font-size: 10px">
            <div class="pr-3"></div>
            <div class="flex items-center ml-auto">
              <a
                class="start-tour bg-indigo-500 hover:bg-indigo-700 text-white text-xs font-bold py-1 px-4 rounded transition-all duration-200"
                href="#"
              >
                Start Tour
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      if (self == top) {
        document.getElementsByTagName('body')[0].style.display = 'block';
      } else {
        top.location = self.location;
      }
    </script>
    <!-- <script type="module" src="dist/bundle.js"></script> -->
    <script type="module" src="src/index.js"></script>
  </body>
</html>
